<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexia - Biblioteca de PDFs</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- PDF.js para el visor embebido -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- JSZip + epub.js para el visor de EPUB embebido -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
  :root{
    --bg:#f4f1ea;
    --bg-card:#ffffff;
    --text:#1a1a2e;
    --text-soft:#5a5a72;
    --navy:#0d1b3e;
    --gold:#c9a227;
    --gold-light:#e6c761;
    --border:#e0dccf;
    --shadow: rgba(13,27,62,0.12);
    --danger:#b3382c;
  }
  [data-theme="dark"]{
    --bg:#0f1220;
    --bg-card:#1a1e30;
    --text:#eae7dd;
    --text-soft:#a3a3b8;
    --navy:#0d1b3e;
    --gold:#d4b13a;
    --gold-light:#e8cd6e;
    --border:#2a2e42;
    --shadow: rgba(0,0,0,0.4);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .3s, color .3s;
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 24px;
    background:var(--navy);
    box-shadow:0 2px 10px var(--shadow);
    flex-wrap:wrap;
    gap:12px;
  }

  .logo-wrap{ display:flex; align-items:center; gap:12px; }

  .logo{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo img{ height:56px; width:auto; display:block; object-fit:contain; }

  .brand-name-img{
    height:26px;
    width:auto;
    display:block;
  }

  .header-controls{ display:flex; align-items:center; gap:14px; }

  .theme-toggle{
    background:none;
    border:2px solid var(--gold);
    border-radius:50%;
    width:38px;
    height:38px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:var(--gold-light);
    transition:transform .2s;
  }
  .theme-toggle:hover{ transform:scale(1.1); }

  .lock-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:22px;
    color:var(--gold-light);
    display:flex;
    align-items:center;
  }

  main{ max-width:1200px; margin:0 auto; padding:24px; }

  .toolbar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:24px;
  }

  .search-box{
    flex:1;
    min-width:220px;
    display:flex;
    align-items:center;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 2px 6px var(--shadow);
  }
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:15px;
    width:100%;
    margin-left:8px;
  }
  .search-box svg{ flex-shrink:0; opacity:.6; }

  .sort-select{
    padding:10px 14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--bg-card);
    color:var(--text);
    font-size:14px;
    cursor:pointer;
    box-shadow:0 2px 6px var(--shadow);
  }

  .view-toggle{
    display:flex;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    padding:10px 14px;
    cursor:pointer;
    color:var(--text-soft);
    font-size:16px;
  }
  .view-toggle button.active{
    background:var(--navy);
    color:var(--gold-light);
  }

  /* Grid view */
  #library.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:20px;
  }
  .book-card{
    background:var(--bg-card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 10px var(--shadow);
    cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    display:flex;
    flex-direction:column;
  }
  .book-card:hover{ transform:translateY(-4px); box-shadow:0 6px 18px var(--shadow); }
  .book-cover{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    background:linear-gradient(135deg,var(--navy),#25376b);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-light);
    font-size:12px;
    text-align:center;
    padding:8px;
  }
  .book-info{ padding:10px 12px; }
  .book-title{ font-weight:600; font-size:14px; margin:0 0 4px; line-height:1.3; }
  .book-meta{ font-size:12px; color:var(--text-soft); margin:0; }

  /* List view */
  #library.list{ display:flex; flex-direction:column; gap:10px; }
  #library.list .book-card{
    flex-direction:row;
    align-items:center;
  }
  #library.list .book-cover{
    width:60px;
    height:90px;
    aspect-ratio:unset;
    flex-shrink:0;
    font-size:10px;
  }
  #library.list .book-info{ flex:1; }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-soft);
  }

  /* Modal / lector */
  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.active{ display:flex; }

  .modal-box{
    background:var(--bg-card);
    border-radius:16px;
    width:100%;
    max-width:900px;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
  }
  .modal-header h3{ margin:0; font-size:16px; }
  .modal-close{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:var(--text-soft);
  }
  .reader-body{
    flex:1;
    overflow:auto;
    background:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  .reader-body canvas{
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
    max-width:100%;
    margin-bottom:10px;
  }
  #epubViewer{
    width:100%;
    height:70vh;
    background:#fff;
    border-radius:6px;
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
  }
  .reader-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--bg-card);
  }
  .reader-controls button{
    background:var(--navy);
    color:var(--gold-light);
    border:none;
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
  }
  .reader-controls button:disabled{ opacity:.4; cursor:not-allowed; }

  .audio-bar{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    padding:10px 16px;
    background:var(--navy);
    border-bottom:1px solid var(--border);
  }
  .audio-bar span{ color:var(--gold-light); font-size:13px; }
  .audio-bar audio{ width:100%; }
  .audio-bar iframe{ width:100%; height:152px; border-radius:8px; }
  .audio-bar a#audioExternalLink{ color:var(--gold); font-size:12px; text-decoration:none; align-self:flex-start; }
  .audio-bar a#audioExternalLink:hover{ text-decoration:underline; }

  #themeSelector{
    padding:6px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
  }

  /* Modal del lector en pantalla completa (Fullscreen API o botón) */
  .modal-overlay.is-fullscreen{
    padding:0;
    background:#000;
  }
  .reader-box.is-fullscreen{
    max-width:100%;
    max-height:100%;
    width:100%;
    height:100%;
    margin:0;
    border-radius:0;
  }
  .reader-box.is-fullscreen .reader-body{
    padding:0;
  }
  .reader-box.is-fullscreen #epubViewer,
  .reader-box.is-fullscreen canvas{
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    margin:0;
  }
  /* En pantalla completa solo se ve la X para salir: se ocultan título,
     selector de tema, botón de pantalla completa y la barra inferior de porcentaje */
  .reader-box.is-fullscreen #readerTitle,
  .reader-box.is-fullscreen #themeSelector,
  .reader-box.is-fullscreen #fullscreenBtn,
  .reader-box.is-fullscreen .reader-controls,
  .reader-box.is-fullscreen .audio-bar{
    display:none;
  }
  .reader-box.is-fullscreen .modal-header{
    justify-content:flex-end;
    border-bottom:none;
    position:absolute;
    top:0; right:0;
    z-index:2;
    padding:10px 14px;
  }

  /* Adaptación para tablets */
  @media (max-width: 1024px){
    #library.grid{ grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:14px; }
    .modal-box{ max-width:100%; width:100%; max-height:100vh; height:100vh; border-radius:0; }
    #epubViewer{ height:100%; }
    .reader-body{ padding:10px; }
    .reader-controls{ padding:14px; gap:20px; }
    .reader-controls button{ padding:12px 18px; font-size:15px; min-height:44px; }
    .modal-header{ padding:14px 16px; }
    .modal-close{ font-size:26px; min-width:44px; min-height:44px; }
    .audio-bar iframe{ height:132px; }
  }
  @media (max-width: 640px){
    #library.grid{ grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
    header{ padding:12px 16px; }
  }

  /* Login modal */
  .login-box{ max-width:360px; padding:24px; text-align:center; }
  .login-box input{
    width:100%;
    padding:12px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    margin:16px 0;
    outline:none;
  }
  .login-box button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--navy);
    color:var(--gold-light);
    font-weight:600;
    cursor:pointer;
    font-size:15px;
  }
  .login-error{ color:var(--danger); font-size:13px; min-height:18px; }

  /* Admin panel */
  .admin-panel{ padding:24px; max-width:700px; }
  .admin-panel h3{ margin-top:0; }
  .admin-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .admin-form input,
  .admin-form select{
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  .admin-form button{
    padding:10px;
    border-radius:10px;
    border:none;
    background:var(--navy);
    color:var(--gold-light);
    font-weight:600;
    cursor:pointer;
  }
  .admin-body{ flex:1; overflow-y:auto; padding:20px; }
  .admin-list{ border-top:1px solid var(--border); padding-top:10px; margin-top:10px; }
  .admin-list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .admin-list-item button{
    background:var(--danger);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    font-size:12px;
  }
  .admin-list-item .move-btn{
    background:var(--navy);
    color:var(--gold-light);
    margin-right:4px;
  }
  .admin-list-item .move-btn:disabled{
    opacity:.35;
    cursor:default;
  }

  .progress-badge{
    display:inline-block;
    font-size:11px;
    background:var(--gold);
    color:var(--navy);
    padding:2px 8px;
    border-radius:20px;
    margin-top:4px;
  }
  .progress-bar-track{
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    margin-top:6px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--gold);
    border-radius:4px;
    transition:width .3s ease;
  }
  .format-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    background:var(--navy);
    color:var(--gold-light);
    padding:2px 7px;
    border-radius:6px;
    margin-left:6px;
    vertical-align:middle;
  }
  .offline-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--text-soft);
    margin-top:6px;
    cursor:pointer;
    user-select:none;
  }
  .offline-check input{ cursor:pointer; }
  .offline-check.is-downloading{ opacity:.6; pointer-events:none; }
  .offline-check .offline-state{ font-size:11px; }
</style>
</head>

<main>
  <div class="toolbar">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="Buscar por título o autor...">
    </div>
    <select id="sortSelect" class="sort-select" title="Ordenar por">
      <option value="custom">Orden personalizado</option>
      <option value="title">Por título (A-Z)</option>
      <option value="author">Por autor (A-Z)</option>
    </select>
    <div class="view-toggle">
      <button id="gridBtn" class="active" title="Vista de grilla">▦</button>
      <button id="listBtn" title="Vista de lista">☰</button>
    </div>
  </div>

  <div id="library" class="grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">No se encontraron libros.</div>
</main>

<!-- Modal lector -->
<div class="modal-overlay" id="readerModal">
  <div class="modal-box reader-box">
    <div class="modal-header">
      <h3 id="readerTitle">Título del libro</h3>
      <div style="display:flex;align-items:center;gap:8px;">
        <select id="themeSelector" title="Tema de lectura">
          <option value="light">☀️ Claro</option>
          <option value="dark">🌙 Oscuro</option>
          <option value="sepia">📜 Sepia</option>
        </select>
        <button class="modal-close" id="fullscreenBtn" title="Pantalla completa">⛶</button>
        <button class="modal-close" id="closeReader">&times;</button>
      </div>
    </div>
    <div class="audio-bar" id="audioBar" style="display:none;">
      <span id="audioLabel">🎧 Audiolibro</span>
      <audio id="audioPlayer" controls preload="metadata"></audio>
      <iframe id="audioEmbed" style="display:none;" frameborder="0" allow="encrypted-media; autoplay; clipboard-write" loading="lazy"></iframe>
      <a id="audioExternalLink" target="_blank" rel="noopener" style="display:none;">Abrir en la plataforma original ↗</a>
    </div>
    <div class="reader-body" id="readerBody">
      <canvas id="pdfCanvas"></canvas>
      <div id="epubViewer" style="display:none;"></div>
    </div>
    <div class="reader-controls">
      <button id="prevPage">‹ Anterior</button>
      <span id="pageIndicator">Página 1 de 1</span>
      <button id="nextPage">Siguiente ›</button>
    </div>
  </div>
</div>

<!-- Modal login admin -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box login-box">
    <div class="modal-header">
      <h3>Acceso administrador</h3>
      <button class="modal-close" id="closeLogin">&times;</button>
    </div>
    <input type="email" id="emailInput" placeholder="Email" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button id="loginSubmit">Ingresar</button>
  </div>
</div>

<!-- Modal panel admin -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-box admin-panel">
    <div class="modal-header">
      <h3>Panel de administración</h3>
      <button class="modal-close" id="closeAdmin">&times;</button>
    </div>
    <div class="admin-body">
      <div class="admin-form">
        <input type="text" id="newTitle" placeholder="Título">
        <input type="text" id="newAuthor" placeholder="Autor">
        <select id="newFileType">
          <option value="pdf">PDF</option>
          <option value="epub">EPUB</option>
        </select>
        <input type="url" id="newPdfUrl" placeholder="URL del archivo (GitHub u otro hosting)">
        <input type="url" id="newAudioUrl" placeholder="URL del audiolibro (archivo directo, Spotify, YouTube/YT Music o SoundCloud)">
        <input type="url" id="newCoverUrl" placeholder="URL de la portada (opcional)">
        <input type="number" id="newPages" placeholder="Cantidad de páginas">
        <input type="number" id="newYear" placeholder="Año de publicación">

        <button id="cancelEditBtn" style="display:none;background:transparent;border:1px solid var(--border);">Cancelar edición</button>
      </div>
      <div class="admin-list" id="adminList"></div>
    </div>
  </div>
</div>

<script>
/* ============ CONFIGURACIÓN FIREBASE ============ */
/* Reemplazar con las credenciales del proyecto Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyBVdPrs1pzcok8jaMFIjqFIKPRDG0IJEfw",
  authDomain: "lexia-601a8.firebaseapp.com",
  projectId: "lexia-601a8",
  storageBucket: "lexia-601a8.firebasestorage.app",
  messagingSenderId: "380257647374",
  appId: "1:380257647374:web:7ad535bcbc533ea07cb55f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
/* Permite que el catálogo (lista de libros) quede disponible sin conexión
   una vez que se cargó al menos una vez con internet */
db.enablePersistence().catch(err => {
  console.warn('Persistencia offline de Firestore no disponible:', err.code);
});

/* ============ CONFIG PDF.js ============ */
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let books = [];
let currentView = localStorage.getItem('lexia-view') || 'grid';
let currentSort = localStorage.getItem('lexia-sort') || 'custom';
let currentPdfDoc = null;
let currentPage = 1;
let currentBookId = null;
let currentBookRef = null;
let currentFileType = 'pdf';
let currentEpubBook = null;
let currentEpubRendition = null;

/* ============ TEMA ============ */
function initTheme(){
  const saved = localStorage.getItem('lexia-theme') || 'light';
  document.body.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.body.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('lexia-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});
initTheme();

/* ============ VISTA GRILLA / LISTA ============ */
function setView(view){
  currentView = view;
  localStorage.setItem('lexia-view', view);
  document.getElementById('library').className = view;
  document.getElementById('gridBtn').classList.toggle('active', view === 'grid');
  document.getElementById('listBtn').classList.toggle('active', view === 'list');
}
document.getElementById('gridBtn').addEventListener('click', () => setView('grid'));
document.getElementById('listBtn').addEventListener('click', () => setView('list'));
setView(currentView);

/* ============ ORDEN DE LA BIBLIOTECA ============ */
document.getElementById('sortSelect').value = currentSort;
document.getElementById('sortSelect').addEventListener('change', (e) => {
  currentSort = e.target.value;
  localStorage.setItem('lexia-sort', currentSort);
  renderLibrary();
});

/* Orden personalizado: usa el campo "order" asignado desde el panel admin;
   los libros que todavía no tienen "order" quedan al final, ordenados por título */
function sortByCustomOrder(list){
  return [...list].sort((a, b) => {
    const oa = typeof a.order === 'number' ? a.order : Infinity;
    const ob = typeof b.order === 'number' ? b.order : Infinity;
    if (oa !== ob) return oa - ob;
    return a.title.localeCompare(b.title, 'es', { sensitivity: 'base' });
  });
}

/* ============ RENDER BIBLIOTECA ============ */
function renderLibrary(){
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = books.filter(b =>
    b.title.toLowerCase().includes(query) ||
    (b.author || '').toLowerCase().includes(query)
  );

  let sorted;
  if (currentSort === 'title'){
    sorted = [...filtered].sort((a, b) => a.title.localeCompare(b.title, 'es', { sensitivity: 'base' }));
  } else if (currentSort === 'author'){
    sorted = sortByCustomOrder(filtered).sort((a, b) => (a.author || '').localeCompare(b.author || '', 'es', { sensitivity: 'base' }));
  } else {
    sorted = sortByCustomOrder(filtered);
  }

  const lib = document.getElementById('library');
  const empty = document.getElementById('emptyState');
  lib.innerHTML = '';

  if (sorted.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  sorted.forEach(book => {
    const percent = getPercent(book.id);
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      ${book.coverUrl
        ? `<img class="book-cover" src="${book.coverUrl}" alt="${book.title}">`
        : `<div class="book-cover">${book.title}</div>`}
      <div class="book-info">
        <p class="book-title">${book.title}<span class="format-badge">${(book.fileType || 'pdf').toUpperCase()}</span>${book.audioUrl ? '<span class="format-badge" style="background:var(--gold);color:var(--navy);">🎧</span>' : ''}</p>
        <p class="book-meta">${book.author || 'Autor desconocido'}</p>
        <p class="book-meta">${book.pages || '?'} páginas · ${book.year || '?'}</p>
        ${percent > 0 ? `
        <span class="progress-badge">${percent}% leído</span>
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${percent}%"></div></div>
        ` : ''}
        ${offlineSupported ? `
        <label class="offline-check" data-offline-label="${book.id}">
          <input type="checkbox" class="offline-toggle" data-id="${book.id}" ${isMarkedOffline(book.id) ? 'checked' : ''}>
          <span class="offline-state">📥 Offline</span>
        </label>
        ` : ''}
      </div>
    `;
    card.addEventListener('click', () => openReader(book));
    if (offlineSupported){
      const offlineLabel = card.querySelector(`[data-offline-label="${book.id}"]`);
      const offlineCheckbox = card.querySelector('.offline-toggle');
      offlineLabel.addEventListener('click', e => e.stopPropagation());
      offlineCheckbox.addEventListener('change', async (e) => {
        const stateSpan = offlineLabel.querySelector('.offline-state');
        offlineLabel.classList.add('is-downloading');
        if (e.target.checked){
          stateSpan.textContent = '⏳ Descargando…';
          const ok = await enableOffline(book);
          if (!ok){ e.target.checked = false; }
          stateSpan.textContent = e.target.checked ? '✅ Offline' : '📥 Offline';
        } else {
          await disableOffline(book);
          stateSpan.textContent = '📥 Offline';
        }
        offlineLabel.classList.remove('is-downloading');
      });
    }
    lib.appendChild(card);
  });
}

/* ============ LECTURA OFFLINE (Cache API) ============ */
const OFFLINE_CACHE = 'lexia-offline-files';
const offlineSupported = ('caches' in window);

function getOfflineIds(){
  try { return JSON.parse(localStorage.getItem('lexia-offline-ids') || '[]'); }
  catch(e){ return []; }
}
function setOfflineIds(ids){
  localStorage.setItem('lexia-offline-ids', JSON.stringify(ids));
}
function isMarkedOffline(bookId){
  return getOfflineIds().includes(bookId);
}

/* Descarga el archivo del libro y lo guarda en caché local del navegador */
async function enableOffline(book){
  const url = getFileUrl(book);
  if (!url) return false;
  try {
    const cache = await caches.open(OFFLINE_CACHE);
    const response = await fetch(url);
    if (!response.ok) throw new Error('No se pudo descargar el archivo');
    await cache.put(url, response);
    const ids = getOfflineIds();
    if (!ids.includes(book.id)){ ids.push(book.id); setOfflineIds(ids); }
    return true;
  } catch(err){
    console.error('Error descargando para offline:', err);
    alert('No se pudo descargar "' + book.title + '" para lectura offline.');
    return false;
  }
}

/* Elimina el archivo cacheado del libro */
async function disableOffline(book){
  try {
    const cache = await caches.open(OFFLINE_CACHE);
    await cache.delete(getFileUrl(book));
  } catch(err){ console.error(err); }
  setOfflineIds(getOfflineIds().filter(id => id !== book.id));
}

/* Devuelve una URL local (blob) si el libro está cacheado, o la URL remota si no */
async function getReadableFileUrl(book){
  const url = getFileUrl(book);
  if (!url || !offlineSupported) return url;
  try {
    const cache = await caches.open(OFFLINE_CACHE);
    const cached = await cache.match(url);
    if (cached){
      const blob = await cached.blob();
      return URL.createObjectURL(blob);
    }
  } catch(err){ console.warn('No se pudo leer la caché offline, se usa la red:', err); }
  return url;
}

/* ============ AUDIOLIBRO ============ */
function getEmbedInfo(url){
  try {
    const u = new URL(url);
    const host = u.hostname.replace('www.', '');

    if (host.includes('spotify.com')){
      const knownTypes = ['track', 'album', 'playlist', 'episode', 'show', 'artist'];
      const parts = u.pathname.split('/').filter(Boolean);
      const idx = parts.findIndex(p => knownTypes.includes(p));
      if (idx === -1 || !parts[idx + 1]) return null;
      const type = parts[idx];
      const id = parts[idx + 1].split('?')[0];
      return { label: 'Spotify', height: 51, embedUrl: `https://open.spotify.com/embed/${type}/${id}` };
    }

    if (host === 'youtube.com' || host === 'youtu.be' || host === 'music.youtube.com'){
      let videoId = null;
      const playlistId = u.searchParams.get('list');
      const label = host === 'music.youtube.com' ? 'YouTube Music' : 'YouTube';
      if (host === 'youtu.be'){
        videoId = u.pathname.slice(1).split('?')[0];
      } else if (u.pathname === '/watch'){
        videoId = u.searchParams.get('v');
      } else if (u.pathname.startsWith('/embed/')){
        videoId = u.pathname.split('/')[2];
      }
      if (videoId){
        return { label, height: 75, embedUrl: `https://www.youtube.com/embed/${videoId}${playlistId ? '?list=' + playlistId : ''}` };
      }
      if (playlistId){
        return { label, height: 75, embedUrl: `https://www.youtube.com/embed/videoseries?list=${playlistId}` };
      }
      return null;
    }

    if (host.includes('soundcloud.com')){
      return { label: 'SoundCloud', height: 55, embedUrl: `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23d4af37&auto_play=false&show_user=true` };
    }

    return null;
  } catch(e){
    return null;
  }
}

function setupAudioBar(book){
  const bar = document.getElementById('audioBar');
  const player = document.getElementById('audioPlayer');
  const embed = document.getElementById('audioEmbed');
  const externalLink = document.getElementById('audioExternalLink');

  player.pause();
  player.removeAttribute('src');
  player.ontimeupdate = null;
  player.style.display = 'none';
  embed.style.display = 'none';
  embed.src = '';
  externalLink.style.display = 'none';

  if (!book.audioUrl){
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';

  const info = getEmbedInfo(book.audioUrl);
  if (info){
    document.getElementById('audioLabel').textContent = `🎧 Audiolibro (${info.label})`;
    embed.style.height = info.height + 'px';
    embed.src = info.embedUrl;
    embed.style.display = 'block';
    externalLink.href = book.audioUrl;
    externalLink.textContent = `Si no reproduce, abrir en ${info.label} ↗`;
    externalLink.style.display = 'inline-block';
  } else {
    document.getElementById('audioLabel').textContent = '🎧 Audiolibro';
    player.style.display = 'block';
    player.src = book.audioUrl;
    const savedTime = parseFloat(localStorage.getItem('lexia-audio-' + book.id)) || 0;
    if (savedTime){
      player.addEventListener('loadedmetadata', () => { player.currentTime = savedTime; }, { once: true });
    }
    player.ontimeupdate = () => {
      localStorage.setItem('lexia-audio-' + book.id, player.currentTime);
    };
  }
}

async function openPdfReader(book){
  try {
    currentPdfDoc = await pdfjsLib.getDocument(await getReadableFileUrl(book)).promise;
    const savedPage = parseInt(getProgress(book.id)) || 1;
    currentPage = Math.min(savedPage, currentPdfDoc.numPages);
    applyPdfTheme(readingTheme);
    renderPage(currentPage);
  } catch(err){
    console.error("Error cargando el PDF:", err);
    document.getElementById('readerBody').innerHTML = '<p style="color:#fff;">No se pudo cargar el PDF. Verificá la URL.</p>';
  }
}

async function renderPage(num){
  if (!currentPdfDoc) return;
  const page = await currentPdfDoc.getPage(num);
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const viewport = page.getViewport({ scale: 1.4 });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;

  const totalPages = (currentBookRef && currentBookRef.pages) || currentPdfDoc.numPages;
  const percent = Math.round((num / totalPages) * 100);
  document.getElementById('pageIndicator').textContent = `${percent}% completado`;
  document.getElementById('prevPage').disabled = num <= 1;
  document.getElementById('nextPage').disabled = num >= currentPdfDoc.numPages;

  saveProgress(currentBookId, num);
  savePercent(currentBookId, percent);
}

async function openEpubReader(book){
  document.getElementById('pageIndicator').textContent = 'Cargando EPUB…';
  document.getElementById('prevPage').disabled = true;
  document.getElementById('nextPage').disabled = true;

  try {
    currentEpubBook = ePub(await getReadableFileUrl(book), { openAs: 'epub' });
    currentEpubRendition = currentEpubBook.renderTo('epubViewer', {
      width: '100%',
      height: '100%',
      spread: 'none'
    });
    registerEpubThemes(currentEpubRendition);

    currentEpubRendition.on('relocated', (location) => {
      saveProgress(currentBookId, location.start.cfi);
      if (currentEpubBook.locations && currentEpubBook.locations.length()){
        const pct = Math.round(currentEpubBook.locations.percentageFromCfi(location.start.cfi) * 100);
        document.getElementById('pageIndicator').textContent = `${pct}% completado`;
        savePercent(currentBookId, pct);
      }
    });

    let epubTouchStartX = 0;
    currentEpubRendition.on('touchstart', (e) => {
      epubTouchStartX = (e.changedTouches ? e.changedTouches[0].screenX : e.screenX);
    });
    currentEpubRendition.on('touchend', (e) => {
      const endX = (e.changedTouches ? e.changedTouches[0].screenX : e.screenX);
      const delta = endX - epubTouchStartX;
      if (Math.abs(delta) > 50){
        if (delta < 0) currentEpubRendition.next();
        else currentEpubRendition.prev();
      }
    });

    const savedCfi = getProgress(book.id);
    const displayPromise = currentEpubRendition.display(savedCfi || undefined);
    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 15000));
    await Promise.race([displayPromise, timeoutPromise]);

    document.getElementById('prevPage').disabled = false;
    document.getElementById('nextPage').disabled = false;
    document.getElementById('pageIndicator').textContent = 'Lectura de EPUB';

    currentEpubBook.locations.generate(1600).then(() => {
      const loc = currentEpubRendition.currentLocation();
      if (loc && loc.start){
        const pct = Math.round(currentEpubBook.locations.percentageFromCfi(loc.start.cfi) * 100);
        document.getElementById('pageIndicator').textContent = `${pct}% completado`;
        savePercent(currentBookId, pct);
      }
    }).catch(() => {});
  } catch(err){
    console.error("Error cargando el EPUB:", err);
    document.getElementById('pageIndicator').textContent = 'Error al cargar';
    document.getElementById('epubViewer').innerHTML = '<p style="padding:20px;">No se pudo cargar el EPUB. Verificá la URL o el enlace de Drive.</p>';
  }
}

function destroyEpubReader(){
  if (currentEpubBook){
    try { currentEpubBook.destroy(); } catch(e){}
  }
  currentEpubBook = null;
  currentEpubRendition = null;
  document.getElementById('epubViewer').innerHTML = '';
}

document.getElementById('prevPage').addEventListener('click', () => {
  if (currentFileType === 'epub'){
    if (currentEpubRendition) currentEpubRendition.prev();
  } else if (currentPage > 1){
    currentPage--; renderPage(currentPage);
  }
});
document.getElementById('nextPage').addEventListener('click', () => {
  if (currentFileType === 'epub'){
    if (currentEpubRendition) currentEpubRendition.next();
  } else if (currentPdfDoc && currentPage < currentPdfDoc.numPages){
    currentPage++; renderPage(currentPage);
  }
});

/* Swipe táctil para pasar de página en PDF (EPUB usa su propio sistema de touch en epub.js) */
let readerTouchStartX = 0;
let readerTouchStartY = 0;
document.getElementById('readerBody').addEventListener('touchstart', (e) => {
  readerTouchStartX = e.changedTouches[0].screenX;
  readerTouchStartY = e.changedTouches[0].screenY;
}, { passive: true });
document.getElementById('readerBody').addEventListener('touchend', (e) => {
  if (currentFileType === 'epub') return;
  const deltaX = e.changedTouches[0].screenX - readerTouchStartX;
  const deltaY = e.changedTouches[0].screenY - readerTouchStartY;
  if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)){
    if (deltaX < 0) document.getElementById('nextPage').click();
    else document.getElementById('prevPage').click();
  }
}, { passive: true });
document.getElementById('closeReader').addEventListener('click', () => {
  document.getElementById('readerModal').classList.remove('active');
  currentPdfDoc = null;
  currentBookRef = null;
  destroyEpubReader();
  const player = document.getElementById('audioPlayer');
  player.pause();
  player.removeAttribute('src');
  player.ontimeupdate = null;
  document.getElementById('audioEmbed').src = '';
  if (document.fullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  document.querySelector('#readerModal .reader-box')?.classList.remove('is-fullscreen');
  document.getElementById('readerModal')?.classList.remove('is-fullscreen');
  renderLibrary();
});

    item.querySelector('[data-action="up"]').addEventListener('click', () => moveBook(book.id, 'up'));
    item.querySelector('[data-action="down"]').addEventListener('click', () => moveBook(book.id, 'down'));
    item.querySelector('[data-action="edit"]').addEventListener('click', () => startEditBook(book));
    item.querySelector('[data-action="delete"]').addEventListener('click', async () => {
      if (confirm(`¿Eliminar "${book.title}"?`)){
        if (editingBookId === book.id) resetAdminForm();
        await db.collection('books').doc(book.id).delete();
      }
    });
    list.appendChild(item);
  });
}

/* Asigna un valor de orden secuencial a todos los libros que todavía no lo tienen,
   respetando el orden actual (personalizado ya asignado, o por título como respaldo) */
async function ensureOrderValues(orderedList){
  const needsMigration = orderedList.some(b => typeof b.order !== 'number');
  if (!needsMigration) return;
  const batch = db.batch();
  orderedList.forEach((book, i) => {
    book.order = i;
    batch.update(db.collection('books').doc(book.id), { order: i });
  });
  try {
    await batch.commit();
  } catch(err){
    console.error('Error asignando orden inicial:', err);
  }
}

/* Intercambia la posición de un libro con la del vecino de arriba o abajo */
async function moveBook(bookId, direction){
  const ordered = sortByCustomOrder(books);
  await ensureOrderValues(ordered);

  const idx = ordered.findIndex(b => b.id === bookId);
  const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
  if (idx === -1 || targetIdx < 0 || targetIdx >= ordered.length) return;

  const current = ordered[idx];
  const target = ordered[targetIdx];
  const currentOrder = current.order;
  const targetOrder = target.order;

  try {
    const batch = db.batch();
    batch.update(db.collection('books').doc(current.id), { order: targetOrder });
    batch.update(db.collection('books').doc(target.id), { order: currentOrder });
    await batch.commit();
  } catch(err){
    console.error('Error moviendo el libro:', err);
    alert('No se pudo cambiar la posición del libro.');
  }
}
